<!DOCTYPE html>
<html lang='pl'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Koszyk na zamówienie</title>
    <link rel='stylesheet' href='style.css'> 
    <script src="app.js" defer></script>
</head>
<body>

    <main class="cart-container">
        <!-- Główny kontener aplikacji – JS wstrzykuje tu dynamicznie cały widok -->
        <div id="cart-app">
            
            <!-- Tu domyślnie pojawi się stan ładowania lub widok wygenerowany przez JS.
                 Dzięki temu unikamy niespójności danych przed załadowaniem skryptu. -->
            <p class="cart-loading">Ładowanie koszyka...</p>

        </div>
    </main>

</body>
</html>
